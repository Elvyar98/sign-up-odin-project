<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="whole-page">
    <div class="left">
        <div class="body">
            <div class="logo">
                <img src="pictures/odin-lined.png" alt="Odin-logo" class="logo-img">
                <p class="logo-text">ODIN</p>
            </div>
        </div>
        <div class="footer">
            <p class="credit">
                Photo by <a target="_blank" href="https://unsplash.com/@huchenme">Hu Chen</a> 
                from <a target="_blank" href="https://unsplash.com/photos/brown-tree-on-surrounded-by-brown-grass-during-golden-hour-60XLoOgwkfA">Unsplash</a></p>
        </div>
    </div>
    <div class="right">
        <div class="header">
            <p class="intro-text">This is not a real service.
                You know you need something like this in your life
                to help you realize your deepest dreams.<br>Sign up <em>now</em> to get started.
                <br><br>You <em>know</em> you want to.
            </p>
        </div>
        <div class="main">
            <div class="main-intro">
            <p>Lets go!<p>
            </div>
            <form action=" " method="get" id="registration-form">
                <div class="form-row-left">
                    <div class="form-row">
                        <label for="first-name">FIRST NAME</label>
                        <input placeholder="Elvis" id="first-name" name="first-name" type="text">
                    </div>

                    <div class="form-row">
                        <label for="email">EMAIL</label>
                        <input placeholder="elvis@Yarquah" id="email" name="email" type="email">
                    </div>
                   
                    <div class="form-row">
                        <label for="first-password">PASSWORD</label>
                        <input required id="first-password" name="first-password" type="password">
                    </div>
                </div>

                <div class="form-row-right">
                    
                     <div class="form-row">
                        <label for="last-name">LAST NAME</label>
                        <input placeholder="Yarquah" id="last-name" name="last-name" type="text">
                    </div>

                    <div class="form-row">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input placeholder="070-134 43 56" 
                                id="phone-number" 
                                name="phone-number" 
                                type="tel">
                    </div>
                    <div class="form-row">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input required id="confirm-password" name="confirm-password" type="password">
                    </div>
                </div>

            </form>
        </div>
        <div class="footer">
            <button type="submit" form="registration-form">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>
    </div>
    </div>
    
</body>
</html>
